[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.21"
optimizer = true
optimizer_runs = 200
verbosity = 1
via_ir = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

